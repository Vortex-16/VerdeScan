version: '3.8'

services:
  # Production service
  verde-scan-prod:
    build:
      context: .
      target: production
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LOG_LEVEL=INFO
      - MAX_CONCURRENT_REQUESTS=5
      - PROCESSING_TIMEOUT=30
      - MAX_FILE_SIZE=10485760  # 10MB
    volumes:
      - ./data:/app/data
      - ./static:/app/static
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - production

  # Development service
  verde-scan-dev:
    build:
      context: .
      target: development
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LOG_LEVEL=DEBUG
      - MAX_CONCURRENT_REQUESTS=3
      - PROCESSING_TIMEOUT=60
      - MAX_FILE_SIZE=10485760  # 10MB
    volumes:
      - .:/app
      - ./data:/app/data
      - ./static:/app/static
      - ./logs:/app/logs
    restart: unless-stopped
    profiles:
      - development

  # Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/app/static:ro
    depends_on:
      - verde-scan-prod
    restart: unless-stopped
    profiles:
      - production

volumes:
  app_data:
  app_static:
  app_logs: