<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verde Scan | AI Forest Monitoring</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary: #10b981;
            --secondary: #064e3b;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --danger: #ef4444;
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: grid;
            grid-template-columns: 350px 1fr;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            background: var(--card);
            padding: 2rem;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            z-index: 100;
        }

        h1 {
            color: var(--primary);
            font-size: 1.5rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        .stat-card {
            background: rgba(15, 23, 42, 0.5);
            padding: 1.25rem;
            border-radius: 0.75rem;
            border: 1px solid #475569;
        }

        .stat-label {
            font-size: 0.875rem;
            color: #94a3b8;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .survival-high { color: var(--primary); }
        .survival-low { color: var(--danger); }

        #map { height: 100%; width: 100%; }

        .patch-selector {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .patch-btn {
            background: #334155;
            border: none;
            color: white;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }

        .patch-btn:hover { background: #475569; }
        .patch-btn.active {
            background: var(--primary);
            font-weight: 600;
        }

        .proof-gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            margin-top: 1rem;
            max-height: 200px;
            overflow-y: auto;
        }

        .proof-img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 0.25rem;
            border: 1px solid #475569;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            background: var(--secondary);
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <h1>🌲 Verde Scan</h1>
        
        <div class="patch-selector" id="patch-list">
            <div class="stat-label">Select Plantation Patch</div>
            <!-- Dynamic buttons -->
        </div>

        <div id="patch-stats" class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Survival Rate</div>
                <div id="survival-rate" class="stat-value survival-high">--%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Dead Trees (Detected)</div>
                <div id="dead-count" class="stat-value">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">AI Processing Time</div>
                <div id="proc-time" class="stat-value" style="font-size: 1rem;">--s</div>
            </div>
        </div>

        <div>
            <div class="stat-label">Visual Proofs (Dead Trees)</div>
            <div id="proof-gallery" class="proof-gallery"></div>
        </div>
        
        <div style="margin-top: auto; font-size: 0.75rem; color: #64748b;">
            System Status: <span class="badge">Live AI Pipeline</span>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map = L.map('map').setView([20.35, 85.82], 14);
        L.tileLayer('https://{s}.tile.thunderforest.com/outdoors/{z}/{x}/{y}.png?apikey=YOUR_API_KEY', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Fallback to OSM if key missing/invalid
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let currentMarkers = L.layerGroup().addTo(map);

        async function loadPatches() {
            const res = await fetch('/api/patches');
            const patches = await res.json();
            const list = document.getElementById('patch-list');
            
            patches.forEach(p => {
                const btn = document.createElement('button');
                btn.className = 'patch-btn';
                btn.innerText = p;
                btn.onclick = () => selectPatch(p, btn);
                list.appendChild(btn);
            });

            if (patches.length > 0) {
                selectPatch(patches[0], list.querySelector('.patch-btn'));
            }
        }

        async function selectPatch(name, btn) {
            document.querySelectorAll('.patch-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const res = await fetch(`/api/patch/${name}`);
            const data = await res.json();
            
            // Update Stats
            document.getElementById('survival-rate').innerText = `${data.summary.survival_rate}%`;
            document.getElementById('dead-count').innerText = data.summary.dead_trees;
            document.getElementById('proc-time').innerText = `${data.summary.processing_time}s`;
            
            // Update Color based on rate
            const rateEl = document.getElementById('survival-rate');
            if (data.summary.survival_rate < 80) {
                rateEl.className = 'stat-value survival-low';
            } else {
                rateEl.className = 'stat-value survival-high';
            }

            // Update Map
            currentMarkers.clearLayers();
            const points = data.details;
            points.forEach(p => {
                const color = p.status === 'DEAD' ? '#ef4444' : '#10b981';
                L.circleMarker([p.lat, p.lng], {
                    radius: 4,
                    fillColor: color,
                    color: "#000",
                    weight: 1,
                    opacity: 1,
                    fillOpacity: 0.8
                }).addTo(currentMarkers)
                  .bindPopup(`Tree ID: ${p.id}<br>Status: ${p.status}`);
            });

            if (points.length > 0) {
                map.panTo([points[0].lat, points[0].lng]);
            }

            // Update Gallery
            const gallery = document.getElementById('proof-gallery');
            gallery.innerHTML = '';
            // Just show first 6 dead tree proofs
            for (let i = 0; i < Math.min(6, data.summary.dead_trees); i++) {
                const img = document.createElement('img');
                img.src = `/static/proof_images/${name}/dead_${String(i).padStart(3, '0')}.jpg`;
                img.className = 'proof-img';
                gallery.appendChild(img);
            }
        }

        loadPatches();
        // Refresh every 5s
        // setInterval(loadPatches, 5000);
    </script>
</body>
</html>
